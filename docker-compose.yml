version: "3.8"

services:
  db:
    image: postgres:15
    container_name: dino_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dino
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: adityasdockership/dino-app:latest
    container_name: dino_app
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dino
    ports:
      - "3000:3000"

volumes:
  postgres_data: